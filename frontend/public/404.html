<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada | Intermedi Demo</title>
  <link rel="icon" href="/favicon.png" />
  <style>
    /* Reserva: a Vercel só mostra esta página se o redirecionamento do app falhar */
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px;
      background: #0e6b50; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { max-width: 560px; }
    .codigo { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9fe3bf; }
    h1 { margin: 0 0 12px; font-size: clamp(34px, 8vw, 56px); line-height: 1.04; letter-spacing: -.035em; }
    p { margin: 0 0 24px; font-size: 18px; line-height: 1.5; color: rgb(255 255 255 / .88); }
    a {
      display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px;
      background: #fff; color: #0e6b50; font-weight: 700; text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="codigo">Intermedi · Erro 404</p>
    <h1>Esta página não existe.</h1>
    <p>O endereço não faz parte da amostra do Intermedi. Ele pode ter mudado ou sido digitado errado.</p>
    <a href="/">Voltar à amostra</a>
  </main>
</body>
</html>
